[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seq2geno2pheno"
dynamic = ["version"]
description = "Genotype-phenotype prediction for bacterial genomes: Seq2Geno features, Geno2Pheno models, with no information from the test set."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# TODO(authors): confirm the author list and order with T.-H. Kuo, E. Asgari and A. C. McHardy
# before any release. The 2021 v2 citation lists Asgari, Kuo, Bremges, Robertson, Weimann, McHardy.
authors = [
    { name = "Hadi Foroughmand Araabi", email = "mohammad-hadi.foroughmand-araabi@helmholtz-hzi.de" },
]
keywords = ["bacterial genomics", "antimicrobial resistance", "genotype-phenotype",
            "pangenome", "machine learning", "nested cross-validation", "data leakage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The modelling half (Geno2Pheno) is pure Python. The feature half (Seq2Geno) calls Prokka,
# Roary, mafft, msa2vcf and BLAST, which are not pip-installable: the Nextflow workflow runs each
# in its own pinned container, and `s2g2p` only parses their outputs.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
skops = ["skops>=0.10"]
dev = ["pytest>=8", "skops>=0.10"]

[project.urls]
Homepage = "https://github.com/hzi-bifo/seq2geno2pheno"
Issues = "https://github.com/hzi-bifo/seq2geno2pheno/issues"

[project.scripts]
s2g2p = "s2g2p.cli:main"

[tool.hatch.version]
path = "src/s2g2p/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s2g2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
