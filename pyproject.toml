[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seq2geno2pheno"
dynamic = ["version"]
description = "Genotype-phenotype prediction for bacterial genomes: Seq2Geno features, Geno2Pheno models, with no information from the test set."
readme = "README.md"
# Academic Software License v1.0 (non-commercial academic use; not an OSI licence, no SPDX id)
license = "LicenseRef-ASL-1.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.10"
# The v2 (2021) author list, unchanged; CITATION.cff carries the same list.
authors = [
    { name = "Ehsaneddin Asgari" },
    { name = "Tzu-Hao Kuo" },
    { name = "Andreas Bremges" },
    { name = "Gary Robertson" },
    { name = "Aaron Weimann" },
    { name = "Alice C. McHardy" },
]
keywords = ["bacterial genomics", "antimicrobial resistance", "genotype-phenotype",
            "pangenome", "machine learning", "nested cross-validation", "data leakage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The modelling half (Geno2Pheno) is pure Python. The feature half (Seq2Geno) calls Prokka,
# Roary, mafft, msa2vcf and BLAST, which are not pip-installable: envs/install.sh installs them
# as pinned conda environments, the Nextflow workflow runs them, and `s2g2p` only parses their
# outputs.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
skops = ["skops>=0.10"]
dev = ["pytest>=8", "skops>=0.10"]

[project.urls]
Homepage = "https://github.com/hzi-bifo/seq2geno2pheno"
Issues = "https://github.com/hzi-bifo/seq2geno2pheno/issues"

[project.scripts]
s2g2p = "s2g2p.cli:main"

[tool.hatch.version]
path = "src/s2g2p/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s2g2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
